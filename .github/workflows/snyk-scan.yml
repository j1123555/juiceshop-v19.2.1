name: Snyk Security Full Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write # Securityタブへの書き込み権限
  actions: read         # ワークフロー情報の読み取り権限

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 1. Snykを実行してSARIFファイルを生成
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true # 脆弱性が見つかっても後のアップロード工程を完走させる
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      # 2. GitHub Code Scanning (Securityタブ) に結果をアップロード
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true # Privateリポジトリ制限で失敗しても、次のアーティファクト保存を実行させる
        with:
          sarif_file: snyk.sarif

      # 3. SARIFファイルをアーティファクトとして保存（ダウンロード可能にする）
      - name: Upload SARIF report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk.sarif
          retention-days: 7 # 7日間保存（任意）
