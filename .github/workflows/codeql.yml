name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  #schedule:
  #  - cron: '39 12 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    # ==========================================
    # ここから下が変更・追加したステップです
    # ==========================================

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # 【追加】SARIFファイルを指定ディレクトリに出力させる
        output: codeql-results 

    # 【追加】出力されたSARIFファイルをCSVに変換
    # ※マトリックス実行に対応するため、言語名（matrix.language）を変数としてファイル名に組み込んでいます
    - name: Convert CodeQL SARIF to CSV
      uses: austenstone/sarif-to-csv@main
      with:
        sarif-file: codeql-results/${{ matrix.language }}.sarif
        csv-file: codeql-${{ matrix.language }}-report.csv

    # 【追加】生成されたCSVをアーティファクトとして保存
    - name: Upload CSV report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-${{ matrix.language }}-report
        path: codeql-${{ matrix.language }}-report.csv
        retention-days: 7
