name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  #schedule:
  #  - cron: '39 12 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    # ==========================================
    # ここから下が変更・追加したステップです
    # ==========================================

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # SARIFファイルを指定ディレクトリに出力させる
        output: codeql-results 

    # 【変更】外部アクションへの依存をやめ、jqコマンドで自力でCSV変換を行う
    - name: Convert CodeQL SARIF to CSV using jq
      shell: bash
      run: |
        CSV_FILE="codeql-${{ matrix.language }}-report.csv"
        SARIF_FILE="codeql-results/${{ matrix.language }}.sarif"
        
        # 1. CSVのヘッダー行を作成
        echo "RuleID,Level,Message,File,Line" > "$CSV_FILE"
        
        # 2. SARIFファイルが存在するか確認し、jqで解析してCSVに追記する
        if [ -f "$SARIF_FILE" ]; then
          jq -r '
            .runs[]?.results[]? | [
              .ruleId,
              (.level // "warning"),
              (.message.text // "" | gsub("\n"; " ")),
              (.locations[0].physicalLocation.artifactLocation.uri // ""),
              (.locations[0].physicalLocation.region.startLine // "")
            ] | @csv
          ' "$SARIF_FILE" >> "$CSV_FILE"
        else
          echo "Warning: SARIF file not found at $SARIF_FILE"
        fi

    # 生成されたCSVをアーティファクトとして保存
    - name: Upload CSV report as artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-${{ matrix.language }}-report
        path: codeql-${{ matrix.language }}-report.csv
        retention-days: 7
